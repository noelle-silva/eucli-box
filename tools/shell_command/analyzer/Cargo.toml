[package]
name = "command-analyzer"
version = "0.1.0"
edition = "2021"
description = "Unified shell command-analyzer for the eucli-box shell_command tool"
license = "MIT"

[profile.release]
opt-level = 3
strip = true
lto = true

[dependencies]
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
shlex = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
once_cell = "1"
base64 = "0.22"
libc = "0.2"
which = "7"
